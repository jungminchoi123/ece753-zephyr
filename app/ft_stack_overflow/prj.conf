# Configuration for Fault Tolerance Stack Overflow Testing Application
# ECE753 Project - Enhanced Fault Tolerance in Zephyr RTOS
# Author: Jack Ostapeic, MS ECE student at UW-Madison

# enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_FAULT_TOLERANCE_INIT_PRIORITY=50

# boot options
CONFIG_BOOT_BANNER=y
CONFIG_BOOT_DELAY=100

# timing management features
CONFIG_TIMESLICING=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_TICKLESS_KERNEL=y

# enable multithreading support
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32

# x86-compatible stack checking (remove MPU_STACK_GUARD)
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_STACK_CANARIES=y

# Disable stack pointer randomization for predictable overflow
CONFIG_STACK_POINTER_RANDOM=0

# logging configuration  
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# console and shell support
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# REDUCED main stack size for testing (was 4096)
CONFIG_MAIN_STACK_SIZE=1024

# Reduce other stack sizes to encourage faster overflow
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256

# enable assert for debugging
CONFIG_ASSERT=y
CONFIG_REBOOT=y

# x86 memory protection (if available)
# CONFIG_X86_MMU=y
# CONFIG_THREAD_STACK_MEM_MAPPED=y
# CONFIG_USERSPACE=n  # Keep simple for testing