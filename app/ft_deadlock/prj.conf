# Deadlock Fault Tolerance Test Configuration
# Author: Jack Ostapeic

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y

# Enable reboot functionality
CONFIG_REBOOT=y

# Enable debugging and logging
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Thread configuration for deadlock scenarios
CONFIG_NUM_COOP_PRIORITIES=10
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_MAIN_THREAD_PRIORITY=7

# Memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096

# Additional debugging
CONFIG_DEBUG=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Enable timing for deadlock detection
CONFIG_SYS_CLOCK_EXISTS=y

# Random number generation for test scenarios
CONFIG_TEST_RANDOM_GENERATOR=y

# Work queue for async recovery
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048