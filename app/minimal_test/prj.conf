# Configuration for Minimal Fault Tolerance Test
# ECE753 Project - Enhanced Zephyr Fault Tolerance

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_FAULT_TOLERANCE_STACK_MONITORING=y
CONFIG_FAULT_TOLERANCE_MEMORY_MONITORING=y
CONFIG_FAULT_TOLERANCE_TIMING_MONITORING=y
CONFIG_FAULT_TOLERANCE_STATISTICS=y

# Enable multithreading and related features
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y

# Console and shell
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable printk for output
CONFIG_PRINTK=y

# Increase main stack size
CONFIG_MAIN_STACK_SIZE=2048

# Enable assertions for debugging
CONFIG_ASSERT=y