# Comprehensive Fault Tolerance Test Application Configuration

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_FAULT_TOLERANCE_AUTO_INIT=y

# Enable all fault detection modules
CONFIG_FT_ENABLE_STACK_OVERFLOW_PROTECTION=y
CONFIG_FT_ENABLE_DEADLOCK_DETECTION=y
CONFIG_FT_ENABLE_BUFFER_OVERFLOW_PROTECTION=y
CONFIG_FT_ENABLE_MEMORY_LEAK_DETECTION=y
CONFIG_FT_ENABLE_TIMING_VIOLATION_DETECTION=y

# Fault thresholds and tuning
CONFIG_FT_STACK_OVERFLOW_THRESHOLD=128
CONFIG_FT_DEADLOCK_TIMEOUT_MS=5000
CONFIG_FT_BUFFER_OVERFLOW_CANARY_SIZE=8
CONFIG_FT_MEMORY_LEAK_THRESHOLD=1024
CONFIG_FT_TIMING_VIOLATION_THRESHOLD_MS=1000

# Thread monitoring and stack info
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_RUNTIME_FILTERING=y

# System configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Timing and scheduling
CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y

# Enable assertions for debugging
CONFIG_ASSERT=y