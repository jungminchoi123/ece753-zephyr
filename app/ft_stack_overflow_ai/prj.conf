# Fault Tolerance Framework Recovery Demo Configuration

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_FT_LOG_LEVEL=3
CONFIG_FT_RECOVERY_THREAD_PRIORITY=3
CONFIG_FT_RECOVERY_STACK_SIZE=2048
CONFIG_FT_ENABLE_STATISTICS=y
CONFIG_FT_ENABLE_ASYNC_RECOVERY=y
CONFIG_FT_MAX_RECOVERY_ATTEMPTS=5
CONFIG_FT_DEFAULT_RECOVERY_TIMEOUT_MS=5000

# Enable thread recovery module
CONFIG_FT_ENABLE_THREAD_RECOVERY=y
CONFIG_FT_THREAD_RECOVERY_STACK_SIZE=2048

# Increased memory and stack sizes for recovery demo
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable stack checking (but not MPU guard for x86)
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_STACK_SENTINEL=y

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Memory management for dynamic thread creation
CONFIG_DYNAMIC_THREAD=y
CONFIG_SYS_HEAP_ALLOC_LOOPS=5
CONFIG_THREAD_MAX_NAME_LEN=32

# Enable runtime statistics and debugging
CONFIG_DEBUG=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y

# Performance optimizations
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
