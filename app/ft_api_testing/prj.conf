# Configuration for Fault Tolerance API Testing Application
# ECE753 Project - Enhanced Fault Tolerance in Zephyr RTOS
# Author: Jack Ostapeic, MS ECE student at UW-Madison

# enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
# CONFIG_FAULT_TOLERANCE_AUTO_INIT=n
# CONFIG_FAULT_TOLERANCE_INIT_PRIORITY=50
# CONFIG_FAULT_TOLERANCE_STACK_MONITORING=y
# CONFIG_FAULT_TOLERANCE_MEMORY_MONITORING=y
# CONFIG_FAULT_TOLERANCE_TIMING_MONITORING=y
# CONFIG_FAULT_TOLERANCE_STATISTICS=y
# CONFIG_FAULT_TOLERANCE_AUTO_RECOVERY=y

# enable multithreading support
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32

# memory management features
# CONFIG_HEAP_MEM_POOL_SIZE=8192
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# logging configuration
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_LOG_PRINTK=y
# CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# console and shell support
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# enable printk for output


# random number generator for testing
# CONFIG_TEST_RANDOM_GENERATOR=y

# increase main stack size for testing
CONFIG_MAIN_STACK_SIZE=4096

# enable assert for debugging
CONFIG_ASSERT=y

# enable basic fault handling
# CONFIG_RUNTIME_ERROR_CHECK=y

# watchdog support
# CONFIG_TASK_WDT=y