# Race Condition Fault Tolerance Configuration
# Author: Jack Ostapeic
# Description: Configuration for race condition detection and mitigation

# Core fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_REBOOT=y

# Logging for detailed race condition analysis
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3

# Threading and concurrency for race condition scenarios
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=32
CONFIG_THREAD_RUNTIME_STATS=y

# Advanced timing and synchronization
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Memory management for shared data monitoring
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_KERNEL_MEM_POOL=y

# Debug and development support
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Precise timing for race condition detection
CONFIG_TIMING_FUNCTIONS=y

# Random number generation for test scenarios
CONFIG_TEST_RANDOM_GENERATOR=y

# Work queue for async recovery operations
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable statistics for performance monitoring
CONFIG_STATS=y
CONFIG_STATS_NAMES=y