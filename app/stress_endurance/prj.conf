# Configuration for Long-Running Stress Test
# ECE753 Project - Enhanced Zephyr Fault Tolerance

# Enable fault tolerance framework with all features
CONFIG_FAULT_TOLERANCE=y
CONFIG_FAULT_TOLERANCE_STACK_MONITORING=y
CONFIG_FAULT_TOLERANCE_MEMORY_MONITORING=y
CONFIG_FAULT_TOLERANCE_TIMING_MONITORING=y
CONFIG_FAULT_TOLERANCE_DEADLOCK_DETECTION=y
CONFIG_FAULT_TOLERANCE_STATISTICS=y
CONFIG_FAULT_TOLERANCE_AUTO_RECOVERY=y
CONFIG_FAULT_TOLERANCE_WATCHDOG_INTEGRATION=y

# Increase resource limits for stress testing
CONFIG_FAULT_TOLERANCE_MAX_LOG_ENTRIES=256
CONFIG_FAULT_TOLERANCE_MAX_HANDLERS_PER_TYPE=8
CONFIG_FAULT_TOLERANCE_MAX_RECOVERY_CALLBACKS=16

# Multithreading configuration
CONFIG_MULTITHREADING=y
# CONFIG_MAX_THREAD_BYTES requires CONFIG_USERSPACE
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=10

# Large heap for stress testing
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging configuration for long-running test
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=4096

# Console output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Random number generation
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Larger stacks for stress testing
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048

# Memory management
CONFIG_KERNEL_MEM_POOL=y

# Enable assertions and runtime checks
CONFIG_ASSERT=y
CONFIG_RUNTIME_ERROR_CHECKS=y

# Task watchdog for monitoring
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y

# Watchdog configuration
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# Performance monitoring
CONFIG_THREAD_RUNTIME_STATS=y

# Enable all available debugging
CONFIG_DEBUG=y
# CONFIG_DEBUG_INFO is not available in this configuration

# Stack protection
CONFIG_HW_STACK_PROTECTION=y
CONFIG_USERSPACE=n

# Optimize for performance in long-running test
CONFIG_SPEED_OPTIMIZATIONS=y
# CONFIG_COMPILER_OPTIMIZATIONS_SIZE not available