# Modular Fault Tolerance Integration Configuration

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y

# Enable all fault tolerance modules for comprehensive testing
CONFIG_FT_ENABLE_STACK_OVERFLOW_PROTECTION=y
CONFIG_FT_STACK_OVERFLOW_THRESHOLD_PERCENT=80
CONFIG_FT_STACK_OVERFLOW_CHECK_INTERVAL_MS=500

CONFIG_FT_ENABLE_BUFFER_OVERFLOW_PROTECTION=y
CONFIG_FT_BUFFER_OVERFLOW_CANARY_VALUE=0xDEADBEEF
CONFIG_FT_BUFFER_OVERFLOW_CHECK_INTERVAL_MS=250

CONFIG_FT_ENABLE_DEADLOCK_DETECTION=y
CONFIG_FT_DEADLOCK_DETECTION_TIMEOUT_MS=5000
CONFIG_FT_DEADLOCK_MONITOR_INTERVAL_MS=1000

CONFIG_FT_ENABLE_RACE_CONDITION_DETECTION=y
CONFIG_FT_RACE_CONDITION_DETECTION_WINDOW_US=1000
CONFIG_FT_RACE_CONDITION_ACCESS_HISTORY_SIZE=64

# Enable core fault tolerance modules (disable problematic ones for now)
CONFIG_FT_ENABLE_THREAD_RECOVERY=y
# CONFIG_FT_ENABLE_SYSTEM_MONITOR=y  # Disabled - requires WATCHDOG
# CONFIG_FT_ENABLE_FAULT_LOGGING=y   # Disabled - requires FLASH and SETTINGS

# System configuration for testing
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_ASSERT=y

# Thread and timing configuration
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=32768