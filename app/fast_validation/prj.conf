# Configuration for Fast Fault Tolerance Validation Test
# ECE753 Project - Enhanced Zephyr Fault Tolerance

# Enable fault tolerance framework
CONFIG_FAULT_TOLERANCE=y
CONFIG_FAULT_TOLERANCE_STACK_MONITORING=y
CONFIG_FAULT_TOLERANCE_MEMORY_MONITORING=y
CONFIG_FAULT_TOLERANCE_TIMING_MONITORING=y
CONFIG_FAULT_TOLERANCE_STATISTICS=y
CONFIG_FAULT_TOLERANCE_AUTO_RECOVERY=y

# Enable multithreading and related features
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Console and shell
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable printk for output
CONFIG_PRINTK=y

# Random number generation for testing
CONFIG_TEST_RANDOM_GENERATOR=y

# Increase main stack size for testing
CONFIG_MAIN_STACK_SIZE=4096

# Enable assertions for debugging
CONFIG_ASSERT=y

# Enable basic fault handling
CONFIG_RUNTIME_ERROR_CHECKS=y

# Task watchdog support (but no hardware watchdog needed)
CONFIG_TASK_WDT=y